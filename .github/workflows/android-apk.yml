name: android-apk

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted ubuntu runners ship an Android SDK; avoid android-actions/setup-android
      # default which tries to install the obsolete "tools" package and fails.
      - name: Locate preinstalled Android SDK
        run: |
          if [ -d "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME already set: $ANDROID_HOME"
          elif [ -d /usr/local/lib/android/sdk ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "Found /usr/local/lib/android/sdk"
          else
            echo "No Android SDK found on runner" >&2
            exit 1
          fi

      - name: Verify Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Accept SDK licenses and install platform + build-tools
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Using SDK=$SDK"
          test -d "$SDK"
          # find sdkmanager
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SM" ]; then
            SM=$(command -v sdkmanager || true)
          fi
          test -n "$SM"
          echo "sdkmanager=$SM"
          yes | "$SM" --sdk_root="$SDK" --licenses >/tmp/sdk-licenses.txt || true
          "$SM" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Verify Android SDK components
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK"
          ls -la "$SDK"
          test -d "$SDK/platforms/android-34"
          echo "platform android-34 OK"
          ls "$SDK/platforms/android-34" | head
          test -d "$SDK/build-tools/34.0.0"
          echo "build-tools 34.0.0 OK"
          ls "$SDK/build-tools/34.0.0" | head
          "$SDK/build-tools/34.0.0/aapt" version || "$SDK/build-tools/34.0.0/aapt2" version --help | head -3 || true
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          "$SM" --sdk_root="$SDK" --list_installed | tee /tmp/sdk-installed.txt | head -60

      - name: Verify Gradle Wrapper
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew --version

      - name: Print Android Gradle Plugin from project
        run: |
          grep -n "com.android.application" build.gradle.kts app/build.gradle.kts
          grep -n "compileSdk\|minSdk\|targetSdk" app/build.gradle.kts

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK on disk
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK path: $APK"
          echo "APK size bytes: $SIZE"
          test "$SIZE" -gt 0
          python3 - <<'PY'
          import zipfile
          apk = "app/build/outputs/apk/debug/app-debug.apk"
          z = zipfile.ZipFile(apk)
          names = z.namelist()
          print("zip_entries", len(names))
          assert "AndroidManifest.xml" in names
          assert any(n == "classes.dex" or (n.startswith("classes") and n.endswith(".dex")) for n in names)
          print("apk_structure_ok")
          PY
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -x "$SDK/build-tools/34.0.0/aapt" ]; then
            "$SDK/build-tools/34.0.0/aapt" dump badging "$APK" | head -20
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
