name: android-apk

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Verify Android SDK paths
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls -la "$ANDROID_HOME"
          command -v sdkmanager
          sdkmanager --list_installed 2>/dev/null | head -80 || sdkmanager --list 2>/dev/null | head -40

      - name: Install Android platform and build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Verify platform and build-tools exist
        run: |
          test -d "$ANDROID_HOME/platforms/android-34"
          ls -la "$ANDROID_HOME/platforms/android-34" | head
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          ls "$ANDROID_HOME/build-tools/34.0.0" | head
          "$ANDROID_HOME/build-tools/34.0.0/aapt" version || true

      - name: Verify Gradle Wrapper
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew --version

      - name: Print Android Gradle Plugin from project
        run: |
          grep -n "com.android.application" build.gradle.kts app/build.gradle.kts
          grep -n "compileSdk\|minSdk\|targetSdk" app/build.gradle.kts

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK on disk
        id: apk
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "apk_size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "APK path: $APK"
          echo "APK size bytes: $SIZE"
          test "$SIZE" -gt 0
          # basic zip/apk structure
          python3 - <<'PY'
          import zipfile, os, sys
          apk = "app/build/outputs/apk/debug/app-debug.apk"
          z = zipfile.ZipFile(apk)
          names = z.namelist()
          print("zip_entries", len(names))
          for need in ("AndroidManifest.xml", "classes.dex"):
              ok = any(n == need or n.endswith("/"+need) or n == need for n in names)
              # dex may be classes.dex at root
              print(need, "present=", need in names or any(n.endswith(need) for n in names))
          assert "AndroidManifest.xml" in names
          assert any(n == "classes.dex" or n.startswith("classes") and n.endswith(".dex") for n in names)
          print("apk_structure_ok")
          PY
          # aapt dump if available
          if [ -x "$ANDROID_HOME/build-tools/34.0.0/aapt" ]; then
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | head -20
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
